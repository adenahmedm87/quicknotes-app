<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>A simple place for your personal, work and study notes.</p>
    </header>

    <main>
      <section aria-labelledby="add-heading">
        <h2 id="add-heading">Add a note</h2>

        <form id="note-form" novalidate>
          <div class="field note-field">
            <label for="note-input">Note text</label>
            <input
              type="text"
              id="note-input"
              name="note"
              aria-describedby="error-message"
              placeholder="What would you like to remember?"
            >
          </div>

          <div class="field">
            <label for="note-category">Category</label>
            <select id="note-category" name="category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
            </select>
          </div>

          <button type="submit">Add Note</button>
        </form>

        <p id="error-message" role="alert"></p>
      </section>

      <section aria-labelledby="notes-heading">
        <h2 id="notes-heading">Your notes</h2>

        <label for="search-input">Search notes</label>
        <input
          type="search"
          id="search-input"
          placeholder="Search by note text..."
        >

        <p id="note-count" aria-live="polite">You have no notes yet.</p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Aden. Built for PLP Project 1.</p>
    </footer>
  </body>
</html>
